name: Vitest (migration branch)

on:
  push:
    branches: [ 'chore/migrate-to-vitest' ]
  pull_request:
    branches: [ 'chore/migrate-to-vitest' ]
  # Allow manual dispatch from the GitHub UI so we can trigger the workflow
  # even if push events are blocked by repository/org settings.
  workflow_dispatch:

jobs:
  vitest:
    name: Run Vitest (migration branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest --config vitest.config.cjs --run --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage

      - name: Compress build assets (gzip + brotli)
        if: success()
        run: |
          sudo apt-get update -y
          sudo apt-get install -y brotli
          echo "Compressing JS/CSS/HTML files in dist with gzip and brotli..."
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -print0 | \
            xargs -0 -I{} bash -c 'gzip -9 -c "{}" > "{}.gz" && brotli -q 11 -f "{}"'

      - name: Upload compressed dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-compressed
          path: |
            dist/**
